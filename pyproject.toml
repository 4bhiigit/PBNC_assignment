[project]
name = "doc-intelligence-service"
version = "0.1.0"
description = "Document Intelligence & Question Extraction Service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic[email]==2.13.5",
    "email-validator>=2.0.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "redis==5.2.1",
    "celery==5.4.0",
    "pymupdf==1.25.1",
    "pillow==11.0.0",
    "opencv-python-headless==4.10.0.84",
    "pytesseract==0.3.13",
    "rapidfuzz==3.11.0",
    "google-genai==2.24.0",
    "pyjwt==2.10.1",
    "argon2-cffi==23.1.0",
    "slowapi==0.1.9",
    "python-multipart==0.0.20",
    "puremagic==1.28",
    "reportlab==4.2.5",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "aiosqlite==0.20.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
